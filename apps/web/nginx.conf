#!———————————————————————————————————————————————————————————————————————————————————————————————!#
#!                                  NO SECRETS IN THE ACCESS LOG                                 !#
#
## The image's default format logs $request, the full request line with its query string, and
## the Referer header. Single-use tokens in links (invites, password resets) and API keys that
## clients put in query strings would land in the logs, and the same URLs come back in the
## Referer of the next request. $request_path is the path as the client sent it, cut at the `?`,
## and no Referer is logged at all. ($uri would also drop the query, but it is the path after
## try_files rewrites it, so every SPA deep link would log as /app/index.html.)
## Query-level debugging belongs in the API's own redacted logs.
#
#!———————————————————————————————————————————————————————————————————————————————————————————————!#

map $request_uri $request_path {
    ~^(?<path>[^?]*) $path;
}

log_format sanitized '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $request_path $server_protocol" '
                     '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    server_tokens off;

    # The image links this path to stdout, so the lines show in docker compose logs.
    access_log /var/log/nginx/access.log sanitized;

    # Relative redirects: an absolute one would name the container's 8080, not the host's WEB_PORT.
    absolute_redirect off;

    # nginx's default, made explicit. nginx accepts and buffers every body under this limit before
    # the API sees it, so a large global limit is free DoS surface. Endpoints that need more, such
    # as OTLP ingestion, raise it in their own location.
    client_max_body_size 1m;

    # Static assets only: /api/ turns it off. Compressing API responses that mix secrets with
    # attacker-influenced input opens BREACH-style attacks. text/html is always compressed.
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml;

    #§———————————————————————————————————————————————————————————————————————————————————————————§#
    #§                                 KEEP THESE AT SERVER LEVEL                                §#
    #
    ## add_header and proxy_set_header are inherited only by locations that declare none of their
    ## own. A single one in a location below silently drops every server-level one of that kind
    ## for it: the security headers, or the client-IP overwrites that stop spoofing. Add new ones
    ## here, never in a location.
    #
    #§———————————————————————————————————————————————————————————————————————————————————————————§#

    # 'always' sends them on errors and redirects too, not just on 2xx responses.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # nginx is the single internet-facing hop, so the socket peer is the client. Overwriting, not
    # appending, discards any X-Forwarded-For the client sent, so the API can trust these once it
    # enables trustProxy. A load balancer in front of nginx would change that.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;

    location / {
        try_files $uri $uri/ =404;
    }

    # The SPA routes on the client, so any unknown path under /app/ gets its entry page.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # A variable makes nginx look `api` up through Docker's DNS per request, not once at startup,
    # so a recreated api container with a new IP is still found. With no URI on proxy_pass, the
    # API receives the original /api/... path unchanged.
    location /api/ {
        # gzip_proxied can't do this: it looks at the request's Via header, not at proxy_pass.
        gzip off;

        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
    }

    # Reserved for OTLP/HTTP ingestion. Without this they'd fall through to static files.
    location ~ ^/v1/(traces|logs|metrics)$ {
        return 404;
    }
}
