[project]
name = "sinthra-worker"
version = "0.0.0"
description = "Sinthra's anomaly worker"

# Must match the Python pinned in the root mise.toml; change both together.
requires-python = ">=3.15,<3.16"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
