name: sinthra

services:
    database:
        # Community edition, not `-oss`: the Apache-only build lacks compression and continuous
        # aggregates (ADR-0001). Not `-ha` either: that image adds HA tooling we don't use.
        image: timescale/timescaledb:2.32.1-pg18
        environment:
            # `:?` makes compose refuse to start with this message instead of substituting an
            # empty value, so the database never runs with default or blank credentials.
            POSTGRES_USER: ${DB_USER:?set DB_USER in the root .env}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the root .env}
            POSTGRES_DB: ${DB_DB:?set DB_DB in the root .env}
        ports:
            # Loopback only: the database must not be reachable from the network.
            - 127.0.0.1:${DB_PORT:?set DB_PORT in the root .env}:5432
        volumes:
            # Postgres 18 images keep PGDATA in a per-major subdirectory, so the volume mounts
            # the parent; a later major upgrade can then sit beside the old data.
            - db-data:/var/lib/postgresql
        healthcheck:
            # `$$` defers expansion to the container, where the credentials above are set.
            test:
                - CMD-SHELL
                - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

volumes:
    db-data:
